# Runs on the sandbox EC2 host (placed in /opt/sandbox by user_data).
# cloudflared makes an outbound tunnel to Cloudflare; Caddy sits behind it.
# Nothing here publishes a port on the host.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks: [edge]
    depends_on: [caddy]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  edge:
